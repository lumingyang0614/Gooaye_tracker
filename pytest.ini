[pytest]
# Only collect the real suite. test_output/ holds artifacts kept from past QA
# runs — including copies of another project's test files — and collecting
# those aborts the whole run on import errors before a single test executes.
testpaths = tests

# Keep pytest's tmp_path fixtures inside the project. The default lives under
# the system temp directory, and on this machine
# %LOCALAPPDATA%\Temp\pytest-of-<user> was created with an ACL the current user
# cannot read, list or delete without elevation, which makes every tmp_path
# test error out before it runs. Pointing basetemp at a project-local path
# sidesteps that without needing an administrator.
# Note: pytest deletes this directory at the start of each run, so never point
# it at anything you want to keep.
addopts = --basetemp=.pytest_tmp
