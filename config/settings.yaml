app:
  title: Gooaye Tracker
  language: zh-TW
  timezone_offset_hours: 8   # 台灣不採用日光節約時間，用固定 UTC+8 即可

sources:
  transcripts_pack:
    # 非官方 AI 聽寫逐字稿站；整包資料無需登入，Access-Control-Allow-Origin: * 為公開資料。
    manifest_url: https://whatmkreallysaid.com/pack_manifest.json
    pack_url: https://whatmkreallysaid.com/transcripts.json.br
    episode_url_template: "https://whatmkreallysaid.com/episode.html?file=EP{n}"
  feed:
    # 股癌實際音檔來源（SoundOn RSS），同時也是 Apple Podcasts / Spotify 背後的來源。
    rss_url: https://feeds.soundon.fm/podcasts/954689a5-3096-43a4-a80b-7810b219cef3.xml
  vocus:
    # 付費逐字稿沙龍；只讀取未登入即可見的免費文章（isPay=false），不做付費牆繞過或帳密登入。
    enabled: false
    room_url: https://vocus.cc/salon/6908b98efd89780001cb1d32/room/6908c04d5ed52e53fa5821e4
  whisper:
    # 用本機 Whisper 補上逐字稿站尚未收錄的最新集數，沿用本機推論、不外送音檔的原則。
    enabled: true
    # 一次同步最多用 Whisper 補幾集，避免逐字稿站斷線或大改版時暴增轉譯工作量。
    gap_episode_limit: 3

sync:
  # 一次同步最多處理幾個「新增或內容有變」的集數（避免第一次同步就把 693 集全部送進 LLM）。
  incremental_new_limit: 20
  analysis_batch_size: 2
  chunk_max_characters: 11000
  # 每集分析之間的間隔秒數。一集就是一次大請求，連續打 20 集很容易在中途被
  # provider 回 429，之後剩下的集數也會跟著全失敗。設 0 可關閉。
  episode_analysis_pause_seconds: 2.0

analysis:
  temperature: 0.1
  max_input_characters: 12000
  # 公司級論點分析：在逐段彙整之外，另外呼叫一次 LLM 產生每家公司的核心論點與優劣勢。
  # 關掉的話公司觀點仍可用，但「主要觀點」會退回成逐段摘要拼接、優劣勢為空。
  company_analysis_enabled: true
  # 一次送幾家公司給模型。調大可減少往返次數，但單次 prompt 會變長。
  company_analysis_batch_size: 2
  # 每家公司最多取幾個（重要度最高的）片段作為依據。
  company_analysis_segment_limit: 8
  # 每個片段摘要送進 prompt 前截斷的字數。
  company_analysis_segment_characters: 600
  company_analysis_max_tokens: 8192
  # 每批公司之間的間隔秒數。公司論點分析是整個專案打 LLM 最密集的地方
  # （17 家公司 = 9 批連續請求），雲端 provider 會回 429 Too Many Requests，
  # 一旦被擋，那一批就只剩逐段彙整的退回文字。調大可降低被限流的機率。
  company_analysis_pause_seconds: 2.0
  # 收到 429／5xx 時的重試設定（所有 OpenAI 相容 provider 共用）。
  # 有 Retry-After 標頭時以標頭為準，沒有的話用指數退避加隨機抖動。
  # rate_limit_max_retries: 0 等於關掉重試。
  rate_limit_max_retries: 4
  rate_limit_backoff_seconds: 5.0
  rate_limit_max_backoff_seconds: 60.0

# 與 X Stock Tracker（E:\X_stock_tracker）的整合。
# 開啟後，每次公司觀點更新完，就把 Gooaye 這邊算出來的公司列以 source='gooaye'
# 寫進 X Stock Tracker 的 x_company_views 資料表，讓那邊的儀表板可以把「股癌的
# 看法」跟「X 貼文的看法」並排比較。連線位址讀 .env 的 XSTOCKTRACKER_DB_URL；
# 沒設定就自動略過，不會讓同步失敗。
# 前置作業（在 E:\X_stock_tracker 執行一次）：
#   python -m scripts.migrate_company_view_source
# 它會加上 source 欄位、把唯一鍵改成 (source, symbol)，並授權本專案的資料庫角色
# 寫入 x_company_views（其餘資料表維持唯讀／無權限）。
xstocktracker:
  push_company_insights: true

schedules:
  # 背景排程：不用手動打 API，服務啟動後就定期同步新集數並更新公司觀點。
  # 關掉的話一切照舊，只是要自己呼叫 POST /api/sync。
  enabled: true
  episode_sync_enabled: true
  taiwan_security_sync_enabled: true
  # 服務啟動後等幾秒才跑第一次（讓 FastAPI 先完成啟動）。
  startup_delay_seconds: 10
  # 股癌大約每週更新兩集，逐字稿站還會落後 1～3 集，每 6 小時檢查一次就很足夠。
  episode_sync_hours: 6
  # 每次背景同步最多分析幾集；留空則用 sync.incremental_new_limit。
  episode_sync_limit: 5
  taiwan_security_sync_hours: 24

# 台股公司名稱／代號別名，供把 LLM 抽取出的中文公司名稱還原成證券代號使用。
# 這份是「手動維護的種子清單」，優先權高於 TWSE／TPEx 證券主檔
# （`python -m scripts.sync_taiwan_securities`），用來補上主檔沒有的俗稱、
# 英文簡稱與非台股公司。
# 每筆可另外指定 market（TW／US／OTHER／UNKNOWN）；未指定時由代號自動判斷
# （.TW→TW、其他已知市場後綴→OTHER、種子確認的英文代號→US），只有在代號會誤導時
# 才需要手動指定，例如台積電 ADR「TSM」在美國掛牌，應標成 US。
company_aliases:
  - {symbol: "2330.TW", company_name: 台積電, aliases: [TSMC, 台積電, "2330", "2330.TW"]}
  - {symbol: "2454.TW", company_name: 聯發科, aliases: [MEDIATEK, 聯發科, "2454", "2454.TW"]}
  - {symbol: "3661.TW", company_name: 世芯-KY, aliases: [ALCHIP, 世芯, "3661", "3661.TW"]}
  - {symbol: "3017.TW", company_name: 奇鋐, aliases: [AVC, 奇鋐, "3017", "3017.TW"]}
  - {symbol: "3665.TW", company_name: 貿聯-KY, aliases: [BIZLINK, 貿聯, "3665", "3665.TW"]}
  - {symbol: "2382.TW", company_name: 廣達, aliases: [QUANTA, 廣達, "2382", "2382.TW"]}
  - {symbol: "2317.TW", company_name: 鴻海, aliases: [FOXCONN, HON HAI, 鴻海, "2317", "2317.TW"]}
  - {symbol: "6669.TW", company_name: 緯穎, aliases: [WIWYNN, 緯穎, "6669", "6669.TW"]}
  - {symbol: "3443.TW", company_name: 智原, aliases: [FARADAY, 智原, "3443", "3443.TW"]}
  - {symbol: "6446.TW", company_name: 藥華藥, aliases: [PHARMAESSENTIA, 藥華藥, "6446", "6446.TW"]}
  - {symbol: "3008.TW", company_name: 大立光, aliases: [LARGAN, 大立光, "3008", "3008.TW"]}
  - {symbol: "3406.TW", company_name: 玉晶光, aliases: [ASIA OPTICAL, GENIUS, 玉晶光, "3406", "3406.TW"]}
  # 股癌經常對照的美股／其他市場公司（非台股，但常與台股供應鏈一起討論）。
  - {symbol: NVDA, company_name: NVIDIA, aliases: [NVIDIA, NVDA]}
  - {symbol: AMD, company_name: AMD, aliases: [AMD]}
  - {symbol: AVGO, company_name: Broadcom, aliases: [BROADCOM, 博通, AVGO]}
  - {symbol: MRVL, company_name: Marvell, aliases: [MARVELL, MRVL]}
  - {symbol: MU, company_name: Micron, aliases: [MICRON, 美光, MU]}
  - {symbol: AMZN, company_name: Amazon, aliases: [AMAZON, AMZN]}
  - {symbol: GOOGL, company_name: Alphabet, aliases: [ALPHABET, GOOGLE, GOOGL]}
  - {symbol: "005930.KS", company_name: Samsung Electronics, aliases: [SAMSUNG, 三星, "005930"]}
  - {symbol: "000660.KS", company_name: SK hynix, aliases: [SKHYNIX, "SK HYNIX", "000660"]}
  # 主檔對不上的別名。日股主檔存的是日文原名（村田製作所、ローム），美股主檔存的是
  # registered name（Palantir Technologies Inc.），股癌講的是簡稱或中文譯名，兩邊
  # 永遠碰不到。沒有這幾行的話，同一家公司會在公司觀點裡出現兩列（例如 村田 與
  # 村田制作所、ROHM 與 羅姆），提及次數與證據被拆成一半。
  - {symbol: PLTR, company_name: Palantir, aliases: [PALANTIR, "PALANTIR TECHNOLOGIES", PLTR]}
  - {symbol: TXN, company_name: Texas Instruments, aliases: ["TEXAS INSTRUMENTS", 德州儀器, 德州仪器, TXN]}
  # symbol 必須加引號：YAML 1.1 會把裸寫的 ON/OFF/YES/NO/Y/N 當成布林值，
  # `symbol: ON` 會變成 True，公司代號就成了 "TRUE"。
  - {symbol: "ON", company_name: onsemi, aliases: [ONSEMI, "ON SEMICONDUCTOR", 安森美]}
  - {symbol: "6981.T", company_name: 村田製作所, aliases: [MURATA, 村田, 村田製作所, 村田制作所]}
  - {symbol: "6963.T", company_name: ROHM, aliases: [ROHM, 羅姆, 罗姆, ローム]}
  - {symbol: "6752.T", company_name: Panasonic, aliases: [PANASONIC, 松下, パナソニック]}
  - {symbol: "6762.T", company_name: TDK, aliases: [TDK]}
